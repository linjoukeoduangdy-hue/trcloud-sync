name: TRCloud Sync to Firestore

on:
  schedule:
    # รันทุก 2 ชั่วโมง (เวลา UTC) - ตรงกับ 00:00, 02:00, 04:00 ... ตามเวลา UTC
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # อนุญาตให้กดรันด้วยมือได้จากหน้า GitHub Actions

permissions:
  contents: write   # จำเป็น เพื่อให้ workflow commit ไฟล์ state.json กลับเข้า repo ได้

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TRCloud -> Firestore sync
        env:
          TRCLOUD_COMPANY_ID: ${{ secrets.TRCLOUD_COMPANY_ID }}
          TRCLOUD_PASSKEY: ${{ secrets.TRCLOUD_PASSKEY }}
          TRCLOUD_ENCRYPT_HEAD: ${{ secrets.TRCLOUD_ENCRYPT_HEAD }}
          TRCLOUD_ORIGIN: ${{ secrets.TRCLOUD_ORIGIN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python sync_trcloud_firestore.py

      - name: Commit updated state.json back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "chore: update sync state [skip ci]"
          git push
